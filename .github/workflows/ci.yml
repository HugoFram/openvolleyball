name: Verify Windows application
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run models:fetch
      - run: npm test
      - run: npm run build
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-test-evidence
          path: |
            test-results
            playwright-report

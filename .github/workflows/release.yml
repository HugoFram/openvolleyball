name: Publish official Windows release
on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
  workflow_dispatch:
concurrency:
  group: official-release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check official version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Only official versions can be published' }
          "version=$version" >> $env:GITHUB_OUTPUT
          gh release view "v$version" --repo $env:GITHUB_REPOSITORY 2>$null
          $exists = $LASTEXITCODE -eq 0
          if ($exists) { "publish=false" >> $env:GITHUB_OUTPUT }
          else { "publish=true" >> $env:GITHUB_OUTPUT }
          exit 0
      - run: npm ci
        if: steps.version.outputs.publish == 'true'
      - run: npm run models:fetch
        if: steps.version.outputs.publish == 'true'
      - run: npm test
        if: steps.version.outputs.publish == 'true'
      - run: npm run package
        if: steps.version.outputs.publish == 'true'
      - name: Check packaged workflows
        if: steps.version.outputs.publish == 'true'
        run: npm run test:ui
        env:
          OV_PACKAGED_EXE: ${{ github.workspace }}\release\win-unpacked\Open Volleyball.exe
      - name: Check portable executable
        if: steps.version.outputs.publish == 'true'
        run: node scripts/smoke-portable.mjs
      - name: Package downloads
        if: steps.version.outputs.publish == 'true'
        run: |
          git restore -- docs/screenshots
          python scripts/package-release.py
      - name: Publish official release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $assets = @(
            "release/Open-Volleyball-$env:VERSION-Windows.exe",
            "release/Open-Volleyball-$env:VERSION-Windows.zip",
            "release/Open-Volleyball-$env:VERSION-source.bundle",
            "release/SHA256SUMS-$env:VERSION.txt"
          )
          gh release create "v$env:VERSION" @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Open Volleyball $env:VERSION" --latest --notes-file docs/RELEASE.md
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: official-release-test-evidence
          path: |
            test-results
            playwright-report
